<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <title>Tehuti StimEditor</title>
    </head>
    <body class="antialiased">
        <div id="toolbar">
            <h1>Tehuti StimEditor</h1>
            <a href="/paths.html" id="pathsLink">Paden →</a>
        </div>

        <main>
            <div class="panel" id="tagNavContainer">
                <button id="addTagButton" onclick="addTag()">Add Tag</button>
                <button id="clearTagFiltersButton" onclick="clearTagFilters()">
                    Clear filters
                </button>
                <div id="tagsList" class=""></div>
            </div>

            <div id="tagEditor" class="panel">
                <input
                    type="number"
                    id="editId"
                    disabled
                    style="display: none"
                />
                <div class="tag-header">
                    <div class="form-group">
                        <label for="editName">Name</label>
                        <input
                            type="text"
                            id="editName"
                            onchange="handleNameChange(event)"
                        />
                    </div>
                    <div class="form-group">
                        <label for="editAdrenaline">Adrenaline</label>
                        <div class="slider-with-value">
                            <input
                                type="range"
                                id="editAdrenaline"
                                min="-0.25"
                                max="0.25"
                                step="0.01"
                                value="0"
                                oninput="handleAdrenalineChange(event)"
                            />
                            <span id="adrenalineValue">0.00</span>
                        </div>
                    </div>
                </div>
                <div id="layerContainer"></div>
            </div>

            <div id="stimContainer"></div>
        </main>

        <div id="overlayMask" onclick="hideOverlay(event)">
            <textarea id="output" onchange="handlePaste(event)"></textarea>
        </div>
        <div
            id="imageZoom"
            onclick="hideImageZoom()"
            tabindex="0"
            onblur="hideImageZoom()"
        >
            <div class="zoom-content" onclick="event.stopPropagation()">
                <div class="zoom-ep-preview">
                    <div class="zoom-mask-control">
                        <label>
                            <input
                                type="checkbox"
                                checked
                                id="cbZoomMask"
                                onchange="handleZoomMask(event)"
                            />
                            Show mask
                        </label>
                    </div>
                    <div id="zoomEpCanvas" class="ep-preview-canvas">
                        <img
                            id="zoomEpMask"
                            class="ep-mask show"
                            src="/masks/mri_mask_017.gif"
                            draggable="false"
                        />
                    </div>
                </div>
                <div class="zoom-main">
                    <img id="zoomedImage" src="" alt="Vergrote foto" />
                    <textarea
                        id="zoomDescription"
                        class="zoom-description"
                        placeholder="Beschrijving..."
                        onchange="handleZoomDescriptionChange(event)"
                    ></textarea>
                    <div class="zoom-nav">
                        <button onclick="showPrevZoomImage(event)">
                            ↑ Vorige
                        </button>
                        <button onclick="showNextZoomImage(event)">
                            ↓ Volgende
                        </button>
                    </div>
                </div>
                <div class="zoom-tag-panel">
                    <div class="zoom-tags-header">
                        <div class="zoom-tags-title">Tags</div>
                        <div id="zoomAdrenaline" class="zoom-adrenaline">
                            Adrenaline: 0
                        </div>
                    </div>
                    <input
                        type="text"
                        id="zoomTagSearch"
                        placeholder="Zoeken..."
                        oninput="handleZoomTagFilter(event)"
                        onkeydown="handleZoomTagSearchKeydown(event)"
                        autocomplete="off"
                    />
                    <div id="zoomedImageTags" class="zoom-tags"></div>
                </div>
            </div>
        </div>
        <script type="module" src="./js/main.ts"></script>
    </body>
</html>
